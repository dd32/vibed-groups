name: Tests

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm run test:js -- --passWithNoTests

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Start wp-env
        run: npx wp-env start

      - name: Fix multisite test config
        run: |
          npx wp-env run cli bash -c "
            sed -i '/MULTISITE/d; /SUBDOMAIN_INSTALL/d; /DOMAIN_CURRENT_SITE/d; /PATH_CURRENT_SITE/d; /SITE_ID_CURRENT_SITE/d; /BLOG_ID_CURRENT_SITE/d; /WP_ALLOW_MULTISITE/d' /wordpress-phpunit/wp-tests-config.php
            echo \"define( 'WP_TESTS_MULTISITE', true );\" >> /wordpress-phpunit/wp-tests-config.php
          "

      - name: Install Composer dependencies
        run: npx wp-env run cli --env-cwd=wp-content/plugins/wordpress-groups composer install --no-interaction

      - name: Run PHPUnit
        run: npx wp-env run cli --env-cwd=wp-content/plugins/wordpress-groups vendor/bin/phpunit
