name: Tests

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm run test:js -- --passWithNoTests

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    # TODO: Fix PHPUnit in wp-env — blocked by polyfills compatibility with PHPUnit 11.
    # See: https://github.com/WordPress/gutenberg/issues/69818
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Start wp-env
        run: npx wp-env start

      - name: Run PHPUnit
        run: npx wp-env run cli --env-cwd=wp-content/plugins/wordpress-groups phpunit
